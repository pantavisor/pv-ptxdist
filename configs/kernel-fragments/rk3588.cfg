# RK3588/RK3588S boards (Orange Pi 5B): DistroKit's v8a config only covers
# RK3568. The RK806 PMIC sits on SPI and supplies most rails, and the eMMC
# controller is a DesignWare SDHCI.
CONFIG_MFD_RK8XX_SPI=y
CONFIG_PINCTRL_RK805=y
CONFIG_MMC_SDHCI_OF_DWCMSHC=y
CONFIG_PHY_ROCKCHIP_USBDP=y
CONFIG_TYPEC_FUSB302=m
