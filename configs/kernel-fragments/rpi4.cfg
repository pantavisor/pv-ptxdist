# Raspberry Pi 4 (BCM2711). DistroKit's v8a config has no Broadcom
# support. Built in: what the boot needs before modules are mounted
# (the SD card on emmc2, console on the mini UART, firmware mailbox and
# clocks), plus Ethernet, which the network container uses.
CONFIG_ARCH_BCM=y
CONFIG_ARCH_BCM2835=y
CONFIG_RASPBERRYPI_FIRMWARE=y
CONFIG_RASPBERRYPI_POWER=y
CONFIG_BCM2835_MBOX=y
CONFIG_CLK_RASPBERRYPI=y
CONFIG_DMA_BCM2835=y
CONFIG_MMC_SDHCI_IPROC=y
CONFIG_MMC_BCM2835=y
CONFIG_SERIAL_8250_EXTENDED=y
CONFIG_SERIAL_8250_SHARE_IRQ=y
CONFIG_SERIAL_8250_BCM2835AUX=y
CONFIG_BCM2835_WDT=y
CONFIG_NET_VENDOR_BROADCOM=y
CONFIG_BCMGENET=y
CONFIG_BROADCOM_PHY=y
# USB sits behind the VL805 PCIe controller, which the firmware resets
CONFIG_PCIE_BRCMSTB=y
CONFIG_RESET_RASPBERRYPI=y
CONFIG_USB_PCI=y
CONFIG_USB_XHCI_PCI=y
CONFIG_ARM_RASPBERRYPI_CPUFREQ=m
CONFIG_SENSORS_RASPBERRYPI_HWMON=m
CONFIG_BCM2711_THERMAL=m
