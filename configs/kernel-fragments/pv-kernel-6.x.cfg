# Options newer kernels split out or default off, which the meta-pantavisor
# fragments predate.

# 6.8+: Pantavisor keeps its loop devices open O_RDWR (loop.c) while mounting
# the BSP squashfs images; without this the mount fails with EBUSY.
CONFIG_BLK_DEV_WRITE_MOUNTED=y

# 6.11+: legacy cgroup v1 controllers that Pantavisor mounts.
CONFIG_CPUSETS_V1=y
CONFIG_MEMCG_V1=y
CONFIG_CGROUP_NET_PRIO=y
CONFIG_CGROUP_NET_CLASSID=y
