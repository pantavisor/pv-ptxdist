# Raspberry Pi 3B+ (BCM2837B0), on top of rpi4.cfg for the shared Broadcom
# support. USB and Ethernet are different from the Pi 4: a dwc2 host
# controller with the LAN7515 USB Ethernet behind it, which the network
# container uses.
CONFIG_USB_DWC2=y
CONFIG_USB_NET_DRIVERS=y
CONFIG_USB_USBNET=y
CONFIG_USB_LAN78XX=y
CONFIG_BCM2835_THERMAL=m
