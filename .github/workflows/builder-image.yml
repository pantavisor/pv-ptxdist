name: builder image

on:
  push:
    branches:
      - main
    paths:
      - 'docker/**'
      - '.github/workflows/builder-image.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pv-ptxdist-builder

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The PTXdist version in the tag is what scripts/pv-docker.sh pulls.
      - name: Read the PTXdist version
        id: version
        run: |
          echo "ptxdist=$(sed -n 's/^ARG PTXDIST_VERSION=//p' docker/Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:ptxdist-${{ steps.version.outputs.ptxdist }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=PTXdist ${{ steps.version.outputs.ptxdist }} build environment for pv-ptxdist
          cache-from: type=gha
          cache-to: type=gha,mode=max
