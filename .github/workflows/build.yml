# Runs for pushes to main and for tags (e.g. release markers). Doc-only
# commits are skipped: three ~15-minute builds is too much for a README fix.
name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    # The fleet label meta-pantavisor's buildkas-target.yaml workflow uses:
    # job only matches the dedicated builder machines, not the generic
    # org-level runners.
    runs-on: ["bsp-builder"]
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # One job per target: builds and artifact only that image plus the
          # signed BSP it was made from ('ptxdist image <img>' builds the
          # BSP too). The boards have their own BSP with only their
          # devicetree; QEMU uses the platform's generic one.
          - name: orangepi5b
            platform: v8a
            toolchain: aarch64-v8a-linux-gnu
            image_targets: pv-orangepi5b.img
            upload: |
              platform-v8a/images/pv-orangepi5b.img
              platform-v8a/images/pantavisor-bsp-orangepi5b.pvrexport.tgz
          - name: rpi4
            platform: v8a
            toolchain: aarch64-v8a-linux-gnu
            image_targets: pv-rpi4.img
            upload: |
              platform-v8a/images/pv-rpi4.img
              platform-v8a/images/pantavisor-bsp-rpi4.pvrexport.tgz
          - name: qemu_x86
            platform: x86_64
            toolchain: x86_64-unknown-linux-gnu
            image_targets: pv-hd.img
            upload: |
              platform-x86_64/images/pv-hd.img
              platform-x86_64/images/u-boot.rom
              platform-x86_64/images/pantavisor-bsp.pvrexport.tgz
    env:
      TOOLCHAIN: /opt/OSELAS.Toolchain-2025.11.1/${{ matrix.toolchain }}/gcc-15.2.1-clang-21.1.8-glibc-2.42-binutils-2.45.1-kernel-6.17.6-sanitized/bin
    steps:
      # A platform build tree is ~10 GB on top of the 5.7 GB build image.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/cache@v4
        with:
          path: src
          key: src-${{ hashFiles('rules/**', 'configs/**', 'base/rules/**', 'base/configs/**') }}
          restore-keys: src-

      # PTXdist refuses to run as root, and self-hosted runners often drive
      # the jobs as root. Do everything as a dedicated 'builder' user
      # instead: hand it the workspace and the docker socket. Idempotent and
      # flock-guarded; two runner instances on one host may run jobs of this
      # workflow in parallel.
      - name: Prepare the non-root build user
        run: |
          exec 9>/tmp/pv-ptxdist-builder.lock
          flock 9
          if ! id -u builder >/dev/null 2>&1; then
            useradd -m -s /bin/bash builder 2>/dev/null \
              || adduser -D -g builder builder 2>/dev/null \
              || true
          fi
          flock -u 9
          # Nobody by that name can be created (some runners lack the shadow
          # tools): run as an existing regular account instead.
          build_user=builder
          if ! id -u "$build_user" >/dev/null 2>&1; then
            build_user="$(awk -F: '$6 ~ /^\/home\// && $7 ~ /sh$/ {print $1; exit}' /etc/passwd)"
          fi
          echo "building as '$build_user'"
          mkdir -p src
          # Different installs ship different group tools; append the user to
          # the docker group if (and only if) it is not a member. The docker
          # socket requires it; sudo picks it up at the next exec.
          if ! awk -F: -v u="$build_user" '
              $1 == "docker" { for (i = 4; i <= NF; i++) if ($i == u) ok = 1 }
              END { exit(ok ? 0 : 1) ; }' /etc/group; then
            usermod -aG docker "$build_user" 2>/dev/null \
              || gpasswd -a "$build_user" docker 2>/dev/null \
              || awk -F: -v u="$build_user" 'BEGIN { OFS = ":" }
                  $1 == "docker" { $4 = ($4 == "" ? u : $4 "," u); } { print }' /etc/group \
                | cat > /etc/group
          fi
          # ptxdist creates the selected_* links by absolute path, so the
          # build user must reach the workspace on the host: runner homes are
          # 750 in some installs.
          p="$(dirname "$GITHUB_WORKSPACE")"
          for _ in 1 2 3 4; do
            chmod a+x "$p" 2>/dev/null || true
            p="$(dirname "$p")"
          done
          chown -R "$build_user":"$(id -g -n "$build_user")" .
          echo "BUILD_USER=$build_user" >> "$GITHUB_ENV"

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo -E -H -u "$BUILD_USER" docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull the build image
        run: sudo -E -H -u "$BUILD_USER" scripts/pv-docker.sh --pull

      # Downloads only; the build itself always starts clean.
      - name: Select the platform
        run: sudo -E -H -u "$BUILD_USER" scripts/pv-docker.sh sh -c "
          ptxdist select configs/ptxconfig &&
          ptxdist platform configs/platform-${{ matrix.platform }}/platformconfig &&
          ptxdist toolchain ${TOOLCHAIN}"

      # 'ptxdist image <img>' builds all stages it depends on, the BSP
      # included.
      - name: Build
        run: |
          for t in ${{ matrix.image_targets }}; do
            sudo -E -H -u "$BUILD_USER" scripts/pv-docker.sh sh -c "ptxdist -q -j\$(nproc) image ${t}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: pv-ptxdist-${{ matrix.name }}
          path: ${{ matrix.upload }}
          if-no-files-found: error

      - name: Keep the end of the build log
        if: failure()
        run: tail -n 2000 platform-${{ matrix.platform }}/logfile > logfile-tail.txt || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logfile-${{ matrix.platform }}
          path: logfile-tail.txt
