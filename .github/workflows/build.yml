name: build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: [self-hosted, Linux, builder]
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Orange Pi 5B, Raspberry Pi 4 and QEMU arm64 share the v8a platform.
          - platform: v8a
            toolchain: aarch64-v8a-linux-gnu
            images: |
              platform-v8a/images/pv-orangepi5b.img
              platform-v8a/images/pv-rpi4.img
              platform-v8a/images/pv-hd.img
              platform-v8a/images/u-boot.bin
              platform-v8a/images/pantavisor-bsp.pvrexport.tgz
          - platform: x86_64
            toolchain: x86_64-unknown-linux-gnu
            images: |
              platform-x86_64/images/pv-hd.img
              platform-x86_64/images/u-boot.rom
              platform-x86_64/images/pantavisor-bsp.pvrexport.tgz
    env:
      TOOLCHAIN: /opt/OSELAS.Toolchain-2025.11.1/${{ matrix.toolchain }}/gcc-15.2.1-clang-21.1.8-glibc-2.42-binutils-2.45.1-kernel-6.17.6-sanitized/bin
    steps:
      # A platform build tree is ~10 GB on top of the 5.7 GB build image.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/cache@v4
        with:
          path: src
          key: src-${{ hashFiles('rules/**', 'configs/**', 'base/rules/**', 'base/configs/**') }}
          restore-keys: src-

      # PTXdist refuses to run as root, and self-hosted runners often drive
      # the jobs as root. Do everything as a dedicated 'builder' user
      # instead: hand it the workspace and the docker socket. Idempotent and
      # flock-guarded; two runner instances on one host may run jobs of this
      # workflow in parallel.
      - name: Prepare the non-root build user
        run: |
          exec 9>/tmp/pv-ptxdist-builder.lock
          flock 9
          id -u builder >/dev/null 2>&1 || useradd -m -s /bin/bash builder || true
          getent group docker >/dev/null && usermod -aG docker builder || true
          flock -u 9
          id -u builder
          chown -R builder:builder .

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo -E -H -u builder docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull the build image
        run: sudo -E -H -u builder scripts/pv-docker.sh --pull

      # Downloads only; the build itself always starts clean.
      - name: Select the platform
        run: sudo -E -H -u builder scripts/pv-docker.sh sh -c "
          ptxdist select configs/ptxconfig &&
          ptxdist platform configs/platform-${{ matrix.platform }}/platformconfig &&
          ptxdist toolchain ${TOOLCHAIN}"

      - name: Build
        run: sudo -E -H -u builder scripts/pv-docker.sh sh -c 'ptxdist -q -j$(nproc) images'

      - uses: actions/upload-artifact@v4
        with:
          name: pv-ptxdist-${{ matrix.platform }}
          path: ${{ matrix.images }}
          if-no-files-found: error

      - name: Keep the end of the build log
        if: failure()
        run: tail -n 2000 platform-${{ matrix.platform }}/logfile > logfile-tail.txt || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logfile-${{ matrix.platform }}
          path: logfile-tail.txt
